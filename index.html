    <style>
        @import url('https://fonts.googleapis.com/css2?family=Aboreto&display=swap');

        :root {
            --gold: #f3e5ab;
            --amber: #d4af37;
            --dark-bg: #0c0c0c;
            --card-bg: #141414;
            --text-gray: #a0a0a0;
        }

        body { 
            background: var(--dark-bg); 
            color: #fff; 
            font-family: 'Aboreto', cursive; 
            margin: 0; 
            padding: 0;
            line-height: 1.6;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            text-align: center;
            padding: 40px 20px 20px 20px;
        }

        header h1 { 
            font-size: 2rem; 
            letter-spacing: 0.3em; 
            margin: 0;
            background: linear-gradient(to right, #fff, var(--amber), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .category-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(12, 12, 12, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            overflow-x: auto;
            padding: 15px;
            gap: 10px;
            border-bottom: 1px solid #222;
            scrollbar-width: none;
        }

        .category-nav::-webkit-scrollbar { display: none; }

        .cat-btn {
            background: transparent;
            color: var(--text-gray);
            border: 1px solid #333;
            padding: 8px 16px;
            white-space: nowrap;
            cursor: pointer;
            font-size: 0.6rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .cat-btn.active {
            border-color: var(--amber);
            color: var(--amber);
            background: rgba(212, 175, 55, 0.1);
        }

        .menu-container { 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 20px 15px 100px 15px;
        }

        .menu-item { 
            background: var(--card-bg); 
            margin-bottom: 30px; 
            padding: 0;
            border: 1px solid #1e1e1e;
            overflow: hidden;
            animation: fadeIn 0.3s ease forwards;
        }

        /* FIXED: 4:5 Aspect Ratio Solution */
        .item-img {
            width: 100%;
            height: auto;
            aspect-ratio: 4 / 5; /* This matches Instagram portrait ratio */
            object-fit: cover;   /* Ensures the image fills the area elegantly */
            border-bottom: 1px solid #1e1e1e;
            display: block;
        }

        .item-content {
            padding: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .flex-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
        .item-name { font-size: 0.95rem; color: #fff; margin: 0; text-transform: uppercase; }
        .price { color: var(--amber); font-weight: bold; font-size: 0.85rem; white-space: nowrap; }
        .description { color: var(--text-gray); font-size: 0.75rem; margin: 8px 0; font-family: sans-serif; letter-spacing: 0.5px; }
        .mood { font-size: 0.65rem; color: #666; font-style: italic; display: block; margin-top: 5px; }

        .view-btn {
            background: transparent;
            color: var(--amber);
            border: 1px solid var(--amber);
            padding: 10px;
            width: 100%;
            cursor: pointer;
            font-size: 0.65rem;
            font-weight: bold;
            margin-top: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .view-btn.active { background: var(--amber); color: #000; }

        .ar-wrapper {
            display: none;
            margin-top: 0;
            height: 450px; /* Slightly taller for vertical focus */
            background: #000;
            position: relative;
        }

        model-viewer { width: 100%; height: 100%; }

        .ar-trigger {
            background: #fff;
            border: none;
            padding: 10px 20px;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: bold;
            font-size: 0.75rem;
            color: #000;
            border-radius: 4px;
            z-index: 10;
        }
    </style>
</head>

        function renderMenu(filter = 'all') {
            const menuList = document.getElementById('menu-list');
            menuList.innerHTML = '';

            const filtered = filter === 'all' ? menuData : menuData.filter(item => item.category === filter);

            filtered.forEach((item) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'menu-item';
                itemDiv.innerHTML = `
                    ${item.image ? `<img src="${item.image}" class="item-img" alt="${item.name}">` : ''}
                    <div class="item-content">
                        <div class="flex-row">
                            <h3 class="item-name">${item.name}</h3>
                            <span class="price">${item.price}</span>
                        </div>
                        <p class="description">${item.desc}</p>
                        <span class="mood">${item.mood}</span>
                        ${item.glb ? `
                            <button class="view-btn" onclick="toggleAR('ar-${item.id}', this)">EXPERIENCE IN 3D</button>
                            <div class="ar-wrapper" id="ar-${item.id}">
                                <model-viewer src="${item.glb}" ar ar-modes="webxr scene-viewer quick-look" camera-controls shadow-intensity="1" touch-action="pan-y">
                                    <button slot="ar-button" class="ar-trigger">✨ VIEW IN YOUR SPACE</button>
                                </model-viewer>
                            </div>
                        ` : ''}
                    </div>
                `;
                menuList.appendChild(itemDiv);
            });
        }

        function filterMenu(category, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMenu(category);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleAR(id, btn) {
            const wrapper = document.getElementById(id);
            if (wrapper.style.display === "block") {
                wrapper.style.display = "none";
                btn.innerText = "EXPERIENCE IN 3D";
                btn.classList.remove('active');
            } else {
                wrapper.style.display = "block";
                btn.innerText = "CLOSE 3D";
                btn.classList.add('active');
            }
        }

        renderMenu('all');
    </script>
