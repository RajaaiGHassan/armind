<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Bar AR Menu</title>
    <!-- The AR Engine (Google Model Viewer) -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    
    <style>
        :root {
            --gold: #f1c40f;
            --dark-bg: #0f0f0f;
            --card-bg: #1a1a1a;
        }

        body { 
            background: var(--dark-bg); 
            color: #fff; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 20px;
            line-height: 1.6;
        }

        h1 { 
            text-align: center; 
            color: var(--gold); 
            text-transform: uppercase; 
            letter-spacing: 2px;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
        }

        .menu-container { max-width: 600px; margin: 0 auto; }

        .menu-item { 
            background: var(--card-bg); 
            border-radius: 15px; 
            margin-bottom: 25px; 
            overflow: hidden;
            border: 1px solid #222;
        }

        .drink-details { padding: 20px; }

        .flex-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: baseline; 
        }

        .drink-name { font-size: 1.4rem; color: var(--gold); margin: 0; }
        .price { font-weight: bold; font-size: 1.2rem; }
        .description { color: #888; margin: 10px 0 20px 0; font-size: 0.9rem; }

        /* AR Viewer Styling */
        model-viewer {
            width: 100%;
            height: 350px;
            background-color: #111;
            --poster-color: transparent;
        }

        /* The Custom AR Button */
        .ar-button {
            background-color: var(--gold);
            border-radius: 30px;
            border: none;
            padding: 12px 24px;
            font-weight: bold;
            color: #000;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(241, 196, 15, 0.3);
        }

        .ar-button:active { transform: scale(0.95); }

        .btn-container {
            display: flex;
            justify-content: center;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <h1>🍸 Signature Drinks</h1>

        <!-- Drink Item 1 -->
        <div class="menu-item">
            <model-viewer 
                src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
                ios-src="" 
                ar 
                ar-modes="webxr scene-viewer quick-look" 
                camera-controls 
                auto-rotate 
                shadow-intensity="1"
                environment-image="neutral"
                exposure="1.2">
                
                <div class="btn-container" slot="ar-button">
                    <button class="ar-button">
                        ✨ VIEW IN YOUR SPACE
                    </button>
                </div>
            </model-viewer>

            <div class="drink-details">
                <div class="flex-header">
                    <h2 class="drink-name">The Space Gin</h2>
                    <span class="price">$16</span>
                </div>
                <p class="description">Infused with botanical stardust, served chilled with a twist of lemon.</p>
            </div>
        </div>

        <!-- Drink Item 2 -->
        <div class="menu-item">
            <model-viewer 
                src="https://static.wixstatic.com/3d/33d5f1_700ce851d3b247e2a1a48daee98e5c8f.glb" 
                ar 
                ar-modes="webxr scene-viewer quick-look" 
                camera-controls 
                auto-rotate 
                shadow-intensity="1">
                
                <div class="btn-container" slot="ar-button">
                    <button class="ar-button">
                        ✨ VIEW IN YOUR SPACE
                    </button>
                </div>
            </model-viewer>

            <div class="drink-details">
                <div class="flex-header">
                    <h2 class="drink-name">Oak Aged Bourbon</h2>
                    <span class="price">$14</span>
                </div>
                <p class="description">A sophisticated blend aged in vintage oak chairs for that woody finish.</p>
            </div>
        </div>
    </div>

</body>
</html>
