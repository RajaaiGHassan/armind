<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sway Soul | Digital Menu</title>
    <!-- Model Viewer for AR -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Aboreto&display=swap');

        :root {
            --gold: #f3e5ab;
            --amber: #d4af37;
            --dark-bg: #0c0c0c;
            --card-bg: #141414;
            --text-gray: #a0a0a0;
        }

        body { 
            background: var(--dark-bg); 
            color: #fff; 
            font-family: 'Aboreto', cursive; 
            margin: 0; 
            padding: 0;
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(to bottom, #1a1a1a, var(--dark-bg));
        }

        header h1 { 
            font-size: 2.5rem; 
            letter-spacing: 0.4em; 
            margin: 0;
            background: linear-gradient(to right, #fff, var(--amber), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Category Navigation */
        .categories {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            padding: 10px 20px;
            gap: 15px;
            sticky: top;
            background: var(--dark-bg);
            border-bottom: 1px solid #222;
        }

        .cat-btn {
            background: transparent;
            color: var(--text-gray);
            border: 1px solid #333;
            padding: 8px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.3s;
        }

        .cat-btn.active {
            border-color: var(--amber);
            color: var(--amber);
        }

        .menu-container { 
            max-width: 600px; 
            margin: 20px auto; 
            padding: 0 15px;
            padding-bottom: 100px;
        }

        /* Menu Item Styling */
        .menu-item { 
            background: var(--card-bg); 
            margin-bottom: 20px; 
            padding: 25px;
            border: 1px solid #1e1e1e;
            transition: transform 0.2s;
        }

        .category-title {
            color: var(--amber);
            font-size: 1.4rem;
            text-transform: uppercase;
            margin: 40px 0 20px 0;
            border-bottom: 1px solid var(--amber);
            display: inline-block;
        }

        .flex-row { display: flex; justify-content: space-between; align-items: baseline; }
        .item-name { font-size: 1.1rem; color: #fff; margin: 0; padding-right: 10px; }
        .price { font-weight: bold; color: var(--amber); font-size: 0.9rem; }
        .description { color: var(--text-gray); font-size: 0.8rem; margin: 10px 0; }
        .mood { font-size: 0.7rem; color: #666; font-style: italic; }

        /* AR Experience Button */
        .view-btn {
            background: transparent;
            color: var(--amber);
            border: 1px solid var(--amber);
            padding: 10px 20px;
            width: 100%;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: bold;
            margin-top: 15px;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .view-btn.active {
            background: var(--amber);
            color: #000;
        }

        /* AR/3D Wrapper */
        .ar-wrapper {
            display: none;
            margin-top: 20px;
            height: 350px;
            background: #000;
            position: relative;
            border: 1px dashed var(--amber);
        }

        model-viewer { width: 100%; height: 100%; }

        .ar-trigger {
            background: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: bold;
            color: #000;
            font-size: 0.7rem;
        }

        /* Scrollbar hide */
        .categories::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <header>
        <h1>SWAY SOUL</h1>
    </header>

    <div class="menu-container" id="menu-list">
        <!-- Items will be injected here by JS -->
    </div>

    <script>
        const menuData = [
            { category: "PADELLINO GOURMET", name: "Mortazza", price: "15€ / 25€", desc: "Mortadella DOP, Pistaccio, Rucola, Limón y Vinagre Balsámico.", mood: "300g / 600g", glb: "https://modelviewer.dev/shared-assets/models/Astronaut.glb" },
            { category: "PADELLINO GOURMET", name: "Calabro", price: "15€ / 25€", desc: "Spianata Calabra, Rucola, Crema N’Duja y Gorgonzola DOP.", mood: "300g / 600g", glb: "https://modelviewer.dev/shared-assets/models/Astronaut.glb" },
            { category: "TABLAS", name: "Tabla Mixta", price: "25€", desc: "Mortadella DOP, Coppa, Speck DOP, Prosciutto 18M, Parmigiano, Brie, Gorgonzola.", mood: "Gourmet", glb: "https://modelviewer.dev/shared-assets/models/Chair.glb" },
            { category: "SIGNATURE COCKTAILS", name: "Smoky Peach", price: "15€", desc: "Laphroaig 10, Melocotón Fermentado, Honey Jengibre, Limón.", mood: "Signature", glb: "https://modelviewer.dev/shared-assets/models/Astronaut.glb" },
            { category: "SIGNATURE COCKTAILS", name: "Malhigo", price: "15€", desc: "Gin Roku, Granadina Artesana, Zumo de Limón, Sal.", mood: "Signature", glb: "https://static.wixstatic.com/3d/33d5f1_700ce851d3b247e2a1a48daee98e5c8f.glb" },
            { category: "MENÚ A LA CARTA", name: "Fettucine al Huevo", price: "15€", desc: "Con Mantequilla, Anchoas y Limón.", mood: "Primer Plato" },
            { category: "MENÚ A LA CARTA", name: "Tiramisù de las Abuelas", price: "8€", desc: "Servido con Licor de Café Artesano.", mood: "Dulce" },
            { category: "IBA COCKTAILS", name: "Paloma", price: "13€", desc: "Tequila 8 blanco, zumo de lima, soda, pomelo.", mood: "IBA" },
            { category: "THE MACALLAN", name: "Macallan 18 Sherry Oak", price: "33€ / 66€", desc: "43° Single Malt", mood: "30ml / 60ml" }
        ];

        const menuList = document.getElementById('menu-list');

        function renderMenu() {
            let currentCat = "";
            
            menuData.forEach((item, index) => {
                if (item.category !== currentCat) {
                    currentCat = item.category;
                    const catTitle = document.createElement('h2');
                    catTitle.className = 'category-title';
                    catTitle.innerText = currentCat;
                    menuList.appendChild(catTitle);
                }

                const itemDiv = document.createElement('div');
                itemDiv.className = 'menu-item';
                itemDiv.id = `item-${index}`;
                
                itemDiv.innerHTML = `
                    <div class="flex-row">
                        <h3 class="item-name">${item.name}</h3>
                        <span class="price">${item.price}</span>
                    </div>
                    <p class="description">${item.desc}</p>
                    <span class="mood">${item.mood}</span>
                    ${item.glb ? `
                        <button class="view-btn" onclick="toggleAR('item-${index}')">EXPERIENCE IN 3D</button>
                        <div class="ar-wrapper">
                            <model-viewer 
                                src="${item.glb}" 
                                ar ar-modes="webxr scene-viewer quick-look" 
                                camera-controls shadow-intensity="1">
                                <button slot="ar-button" class="ar-trigger">✨ VIEW IN YOUR SPACE</button>
                            </model-viewer>
                        </div>
                    ` : ''}
                `;
                menuList.appendChild(itemDiv);
            });
        }

        function toggleAR(id) {
            const container = document.getElementById(id);
            const wrapper = container.querySelector('.ar-wrapper');
            const btn = container.querySelector('.view-btn');
            
            if (wrapper.style.display === "block") {
                wrapper.style.display = "none";
                btn.innerText = "EXPERIENCE IN 3D";
                btn.classList.remove('active');
            } else {
                wrapper.style.display = "block";
                btn.innerText = "CLOSE EXPERIENCE";
                btn.classList.add('active');
            }
        }

        renderMenu();
    </script>
</body>
</html>
