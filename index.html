<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Bar Menu</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    
    <style>
        :root {
            --gold: #f1c40f;
            --dark-bg: #0f0f0f;
            --card-bg: #1a1a1a;
        }

        body { 
            background: var(--dark-bg); 
            color: #fff; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            padding: 20px;
        }

        h1 { text-align: center; color: var(--gold); letter-spacing: 2px; margin-bottom: 30px; }

        .menu-container { max-width: 500px; margin: 0 auto; }

        .menu-item { 
            background: var(--card-bg); 
            border-radius: 12px; 
            margin-bottom: 15px; 
            padding: 20px;
            border: 1px solid #222;
        }

        .flex-row { display: flex; justify-content: space-between; align-items: flex-start; }
        .drink-name { font-size: 1.2rem; color: var(--gold); margin: 0; }
        .price { font-weight: bold; color: #fff; }
        .description { color: #888; font-size: 0.9rem; margin: 10px 0; }

        /* The Toggle Button */
        .view-btn {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            margin-top: 10px;
        }

        .view-btn.active {
            background: var(--gold);
            color: #000;
        }

        /* The AR/3D Container - HIDDEN BY DEFAULT */
        .ar-wrapper {
            display: none;
            margin-top: 15px;
            height: 300px;
            background: #111;
            border-radius: 10px;
            position: relative;
        }

        model-viewer { width: 100%; height: 100%; }

        /* The actual AR trigger button inside the viewer */
        .ar-trigger {
            background: var(--gold);
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: bold;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <h1>🍸 BAR MENU</h1>

        <!-- Drink 1 -->
        <div class="menu-item" id="drink1">
            <div class="flex-row">
                <h2 class="drink-name">Old Fashioned</h2>
                <span class="price">$14</span>
            </div>
            <p class="description">Bourbon, sugar, bitters, and a citrus twist.</p>
            <button class="view-btn" onclick="toggleAR('drink1')">EXPERIENCE IN 3D</button>
            
            <div class="ar-wrapper">
                <model-viewer 
                    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
                    ar ar-modes="webxr scene-viewer quick-look" 
                    camera-controls shadow-intensity="1">
                    <button slot="ar-button" class="ar-trigger">👋 VIEW IN YOUR SPACE</button>
                </model-viewer>
            </div>
        </div>

        <!-- Drink 2 -->
        <div class="menu-item" id="drink2">
            <div class="flex-row">
                <h2 class="drink-name">Espresso Martini</h2>
                <span class="price">$16</span>
            </div>
            <p class="description">Fresh espresso, vodka, and coffee liqueur.</p>
            <button class="view-btn" onclick="toggleAR('drink2')">EXPERIENCE IN 3D</button>
            
            <div class="ar-wrapper">
                <model-viewer 
                    src="https://static.wixstatic.com/3d/33d5f1_700ce851d3b247e2a1a48daee98e5c8f.glb" 
                    ar ar-modes="webxr scene-viewer quick-look" 
                    camera-controls shadow-intensity="1">
                    <button slot="ar-button" class="ar-trigger">👋 VIEW IN YOUR SPACE</button>
                </model-viewer>
            </div>
        </div>

    </div>

    <script>
        function toggleAR(id) {
            const container = document.getElementById(id);
            const wrapper = container.querySelector('.ar-wrapper');
            const btn = container.querySelector('.view-btn');
            
            if (wrapper.style.display === "block") {
                wrapper.style.display = "none";
                btn.innerText = "EXPERIENCE IN 3D";
                btn.classList.remove('active');
            } else {
                wrapper.style.display = "block";
                btn.innerText = "CLOSE 3D";
                btn.classList.add('active');
            }
        }
    </script>
</body>
</html>
