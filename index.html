<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sway Soul | Digital Menu</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Aboreto&display=swap');

        :root {
            --gold: #f3e5ab;
            --amber: #d4af37;
            --dark-bg: #0c0c0c;
            --card-bg: #141414;
            --text-gray: #a0a0a0;
        }

        body { 
            background: var(--dark-bg); 
            color: #fff; 
            font-family: 'Aboreto', cursive; 
            margin: 0; 
            padding: 0;
            line-height: 1.6;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            text-align: center;
            padding: 40px 20px 20px 20px;
        }

        header h1 { 
            font-size: 2rem; 
            letter-spacing: 0.3em; 
            margin: 0;
            background: linear-gradient(to right, #fff, var(--amber), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Fixed Category Bar */
        .category-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(12, 12, 12, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            overflow-x: auto;
            padding: 15px;
            gap: 10px;
            border-bottom: 1px solid #222;
            scrollbar-width: none;
        }

        .category-nav::-webkit-scrollbar { display: none; }

        .cat-btn {
            background: transparent;
            color: var(--text-gray);
            border: 1px solid #333;
            padding: 8px 16px;
            white-space: nowrap;
            cursor: pointer;
            font-size: 0.6rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .cat-btn.active {
            border-color: var(--amber);
            color: var(--amber);
            background: rgba(212, 175, 55, 0.1);
        }

        .menu-container { 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 20px 15px 100px 15px;
        }

        .menu-item { 
            background: var(--card-bg); 
            margin-bottom: 12px; 
            padding: 20px;
            border: 1px solid #1e1e1e;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .flex-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
        .item-name { font-size: 0.95rem; color: #fff; margin: 0; text-transform: uppercase; }
        .price { color: var(--amber); font-weight: bold; font-size: 0.85rem; white-space: nowrap; }
        .description { color: var(--text-gray); font-size: 0.75rem; margin: 8px 0; font-family: sans-serif; letter-spacing: 0.5px; }
        .mood { font-size: 0.65rem; color: #666; font-style: italic; display: block; margin-top: 5px; }

        .view-btn {
            background: transparent;
            color: var(--amber);
            border: 1px solid var(--amber);
            padding: 8px;
            width: 100%;
            cursor: pointer;
            font-size: 0.65rem;
            font-weight: bold;
            margin-top: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .view-btn.active { background: var(--amber); color: #000; }

        .ar-wrapper {
            display: none;
            margin-top: 15px;
            height: 300px;
            background: #000;
            position: relative;
            border: 1px solid #333;
        }

        model-viewer { width: 100%; height: 100%; }

        .ar-trigger {
            background: #fff;
            border: none;
            padding: 8px 16px;
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: bold;
            font-size: 0.7rem;
            color: #000;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <header>
        <h1>SWAY SOUL</h1>
    </header>

    <div class="category-nav" id="cat-nav">
        <button class="cat-btn active" onclick="filterMenu('all', this)">ALL</button>
        <button class="cat-btn" onclick="filterMenu('menú a la carta', this)">A LA CARTA</button>
        <button class="cat-btn" onclick="filterMenu('padellino gourmet', this)">PADELLINO</button>
        <button class="cat-btn" onclick="filterMenu('tablas', this)">TABLAS</button>
        <button class="cat-btn" onclick="filterMenu('signature cocktails', this)">SIGNATURE</button>
        <button class="cat-btn" onclick="filterMenu('iba cocktails', this)">IBA</button>
        <button class="cat-btn" onclick="filterMenu('the macallan', this)">MACALLAN</button>
        <button class="cat-btn" onclick="filterMenu('licores', this)">LICORES</button>
    </div>

    <div class="menu-container" id="menu-list"></div>

    <script>
        const menuData = [
            // --- MENÚ A LA CARTA ---
            { category: "menú a la carta", name: "Hummus de Garbanzos", price: "8,5€", desc: "Artesano con Focaccia artesana.", mood: "Entrante" },
            { category: "menú a la carta", name: "Bresaola & Parmigiano", price: "9,5€", desc: "Rúcola, Parmigiano y Limón con Focaccia.", mood: "Entrante" },
            { category: "menú a la carta", name: "Pan de Cristal", price: "5,5€", desc: "Con Tomate y Aceite EVO.", mood: "Entrante" },
            { category: "menú a la carta", name: "Parmigiana de Berenjena", price: "11€", desc: "Focaccia, Aceite EVO y Flor de Sal.", mood: "Entrante" },
            { category: "menú a la carta", name: "Fettucine Anchoas", price: "15€", desc: "Mantequilla, Anchoas y Limón.", mood: "Pasta" },
            { category: "menú a la carta", name: "Paccheri Gorgonzola", price: "15€", desc: "Crema de Rúcola Artesana y Gorgonzola.", mood: "Pasta" },
            { category: "menú a la carta", name: "Fettucine Speck", price: "15€", desc: "Speck, Gorgonzola y Crema de Nueces.", mood: "Pasta" },
            { category: "menú a la carta", name: "Paccheri Pesto", price: "15€", desc: "Con Pesto de Albahaca Artesano.", mood: "Pasta" },
            { category: "menú a la carta", name: "Tiramisù", price: "8€", desc: "Servido con Licor de Café Artesano.", mood: "Dulce" },

            // --- PADELLINO GOURMET ---
            { category: "padellino gourmet", name: "Mortazza", price: "15€ / 25€", desc: "Mortadella DOP, Pistaccio, Rucola, Limón y Balsámico.", mood: "300g / 600g", glb: "https://modelviewer.dev/shared-assets/models/Astronaut.glb" },
            { category: "padellino gourmet", name: "Calabro", price: "15€ / 25€", desc: "Spianata Calabra, Rucola, Crema N’Duja y Gorgonzola.", mood: "300g / 600g", glb: "https://modelviewer.dev/shared-assets/models/Astronaut.glb" },
            { category: "padellino gourmet", name: "Montanaro", price: "15€ / 25€", desc: "Speck, Brie, Rucola y Salsa Rosa.", mood: "300g / 600g", glb: "https://modelviewer.dev/shared-assets/models/Astronaut.glb" },
            { category: "padellino gourmet", name: "Parma – Reggio", price: "15€ / 25€", desc: "Prosciutto di Parma 18m, Parmigiano, Tomate y Rucola.", mood: "300g / 600g", glb: "https://modelviewer.dev/shared-assets/models/Astronaut.glb" },

            // --- TABLAS ---
            { category: "tablas", name: "Tabla Mixta", price: "25€", desc: "Mortadella, Coppa, Speck, Prosciutto, Parmigiano, Brie, Gorgonzola.", mood: "Gourmet", glb: "https://modelviewer.dev/shared-assets/models/Chair.glb" },
            { category: "tablas", name: "Tabla de Queso", price: "17€", desc: "Parmigiano 18M, Brie, Gorgonzola DOP, Pecorino y Mermelada.", mood: "Gourmet", glb: "https://modelviewer.dev/shared-assets/models/Chair.glb" },

            // --- SIGNATURE COCKTAILS ---
            { category: "signature cocktails", name: "Smoky Peach", price: "15€", desc: "Laphroaig 10, Melocotón Fermentado, Honey Jengibre.", mood: "Signature", glb: "https://modelviewer.dev/shared-assets/models/Astronaut.glb" },
            { category: "signature cocktails", name: "Malhigo", price: "15€", desc: "Gin Roku, Granadina Artesana, Zumo de Limón.", mood: "Signature", glb: "https://static.wixstatic.com/3d/33d5f1_700ce851d3b247e2a1a48daee98e5c8f.glb" },
            { category: "signature cocktails", name: "O’ Deus", price: "16€", desc: "Mezcal Rey Campero, Tequila 8, Falernum, Agave.", mood: "Signature", glb: "https://modelviewer.dev/shared-assets/models/Astronaut.glb" },

            // --- IBA COCKTAILS ---
            { category: "iba cocktails", name: "Vieux Carré", price: "13€", desc: "Rye Whiskey, Cognac, Vermouth rojo, Benedictine.", mood: "IBA" },
            { category: "iba cocktails", name: "Paloma", price: "13€", desc: "Tequila 8 blanco, zumo de lima, soda, pomelo.", mood: "IBA" },
            { category: "iba cocktails", name: "Espresso Martini", price: "12€", desc: "Vodka, Licor de Caffè Artesano, espresso.", mood: "IBA" },

            // --- THE MACALLAN ---
            { category: "the macallan", name: "Macallan 12 Double Cask", price: "14€", desc: "40° Single Malt (60ml)", mood: "Whisky" },
            { category: "the macallan", name: "Macallan 18 Sherry Oak", price: "66€", desc: "43° Single Malt (60ml)", mood: "Whisky" },
            { category: "the macallan", name: "Macallan 25 Sherry Oak", price: "490€", desc: "43° Single Malt (60ml)", mood: "Whisky" },

            // --- LICORES ---
            { category: "licores", name: "Few Rye", price: "9,5€", desc: "46.5° - 60ml", mood: "Whisky" },
            { category: "licores", name: "Hibiki Harmony", price: "14,5€", desc: "43° - 60ml", mood: "Whisky Japonés" },
            { category: "licores", name: "Tequila 8 Plata", price: "8,5€", desc: "40° - 60ml", mood: "Tequila" },
            { category: "licores", name: "Clase Azul Reposado", price: "40€", desc: "40° - 60ml", mood: "Tequila Premium" },
            { category: "licores", name: "Rey Campero Coyote", price: "18€", desc: "49.8° - 60ml", mood: "Mezcal" }
        ];

        function renderMenu(filter = 'all') {
            const menuList = document.getElementById('menu-list');
            menuList.innerHTML = '';

            const filtered = filter === 'all' ? menuData : menuData.filter(item => item.category === filter);

            filtered.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'menu-item';
                itemDiv.innerHTML = `
                    <div class="flex-row">
                        <h3 class="item-name">${item.name}</h3>
                        <span class="price">${item.price}</span>
                    </div>
                    <p class="description">${item.desc}</p>
                    <span class="mood">${item.mood}</span>
                    ${item.glb ? `
                        <button class="view-btn" onclick="toggleAR(${index})">EXPERIENCE IN 3D</button>
                        <div class="ar-wrapper" id="ar-${index}">
                            <model-viewer src="${item.glb}" ar ar-modes="webxr scene-viewer quick-look" camera-controls shadow-intensity="1">
                                <button slot="ar-button" class="ar-trigger">✨ VIEW IN YOUR SPACE</button>
                            </model-viewer>
                        </div>
                    ` : ''}
                `;
                menuList.appendChild(itemDiv);
            });
        }

        function filterMenu(category, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMenu(category);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleAR(index) {
            const wrapper = document.getElementById(`ar-${index}`);
            const btn = wrapper.previousElementSibling;
            
            if (wrapper.style.display === "block") {
                wrapper.style.display = "none";
                btn.innerText = "EXPERIENCE IN 3D";
                btn.classList.remove('active');
            } else {
                wrapper.style.display = "block";
                btn.innerText = "CLOSE 3D";
                btn.classList.add('active');
            }
        }

        renderMenu('all');
    </script>
</body>
</html>
